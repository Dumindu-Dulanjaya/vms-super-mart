name: CI — Test & Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Backend Tests ─────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ── Frontend Tests ────────────────────────────────────────────────────────
  test-frontend:
    name: 🧪 Frontend Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --passWithNoTests

      - name: Build frontend (validate compilation)
        run: npm run build
        env:
          VITE_API_URL: ''

# NOTE: Choreo automatically detects new commits and builds/deploys
# No Docker Hub push needed — Choreo builds directly from GitHub source
